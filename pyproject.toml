[project]
name = "quantic-ai-monorepo"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # pep8 naming
    "UP",      # pyupgrade: modern syntax
    "B",       # bugbear: likely bugs
    "SIM",     # simplifications
    "ANN",     # require type annotations
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
